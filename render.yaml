# Blueprint Render: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → conectar repo GitHub

databases:
  - name: papirar-db
    plan: free
    databaseName: papirar
    user: papirar

services:
  - type: web
    name: papirar
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: papirar-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products,write_metaobject_definitions,write_metaobjects,write_products
      - key: SHOPIFY_APP_URL
        value: https://papirar.onrender.com